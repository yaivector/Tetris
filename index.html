<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pixel Block Game</title>
    <style>
        * {
            touch-action: none;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-layout {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .game-container {
            position: relative;
            width: 248px;
            height: 408px;
        }
        canvas#tetris {
            border: 4px solid #fff;
            background-color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            display: block;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            gap: 12px;
        }
        .next-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            border: 3px solid #fff;
            padding: 6px;
            width: 100%;
        }
        .next-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
            border-bottom: 2px solid #fff;
            padding-bottom: 2px;
            width: 100%;
            text-align: center;
        }
        canvas#next {
            background-color: #000;
            display: block;
        }
        .stats-box {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 2px;
        }
        .stat-divider {
            width: 100%;
            height: 2px;
            background-color: #fff;
            margin: 2px 0;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border: 4px solid #fff;
            padding: 15px;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }

        .start-title {
            font-size: 20px;
            color: #fff;
            margin-bottom: 12px;
            border-bottom: 2px solid #fff;
            padding-bottom: 4px;
            letter-spacing: 1px;
        }
        .guide-box {
            font-size: 12px;
            line-height: 1.6;
            color: #ddd;
            text-align: left;
            width: 100%;
            margin-bottom: 15px;
        }
        .guide-box b {
            color: #fff;
        }
        .blink-btn {
            font-size: 13px;
            color: #fff;
            animation: blink 1.2s infinite;
            border: 2px solid #fff;
            padding: 8px 10px;
            background: #111;
            line-height: 1.4;
            text-align: center;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Layout ปุ่มคอนโทรลด้านล่าง */
        .controls-container {
            display: flex;
            justify-content: space-between;
            width: 350px;
            margin-top: -65px; /* ดึงฝั่งขวาขึ้นไปตำแหน่งตามภาพตัวอย่าง */
            padding: 0 10px;
            align-items: flex-end;
        }
        
        .dpad-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 80px; /* เว้นพื้นที่ให้ D-pad อยู่ด้านล่างอย่างเหมาะสม */
        }
        .dpad-row {
            display: flex;
            gap: 14px;
        }

        /* กลุ่มปุ่มด้านขวา เพิ่มระยะห่าง gap เป็น 80px */
        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px; 
        }

        /* ปุ่มวงกลมขนาด 72px */
        .control-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background: #ccc;
            transform: scale(0.94);
        }

        .mobile-guide { display: none; }
        @media (pointer: coarse), (max-width: 768px) {
            .desktop-guide { display: none; }
            .mobile-guide { display: block; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="game-layout">
        <div class="game-container">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div id="start-overlay" class="overlay">
                <div class="start-title">HOW TO PLAY</div>
                
                <div class="guide-box desktop-guide">
                    ← / → : MOVE LEFT/RIGHT<br>
                    ↑ : ROTATE BLOCK<br>
                    ↓ : SOFT DROP (HOLD)<br>
                    <b>SPACE / P</b> : PAUSE GAME
                </div>

                <div class="guide-box mobile-guide">
                    TAP BUTTONS BELOW<br>
                    <b>↓</b> : SOFT DROP (HOLD)<br>
                    <b>↻</b> : ROTATE BLOCK<br>
                    <b>❚❚</b> : PAUSE / CONTINUE
                </div>

                <div class="blink-btn">PRESS SPACE / TAP<br>TO START</div>
            </div>

            <div id="pause-overlay" class="overlay hidden">
                PAUSED<br><span style="font-size: 13px; margin-top: 12px; color: #aaa; text-align: center;">PRESS SPACE / TAP<br>TO CONTINUE</span>
            </div>

            <div id="gameover-overlay" class="overlay hidden">
                GAME OVER<br><span style="font-size: 13px; margin-top: 12px; color: #aaa; text-align: center;">PRESS SPACE / TAP<br>TO RESTART</span>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="next-box">
                <div class="next-title">NEXT</div>
                <canvas id="next" width="60" height="60"></canvas>
            </div>

            <div class="stats-box">
                <div class="stat-group">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score">0</div>
                </div>

                <div class="stat-divider"></div>

                <div class="stat-group">
                    <div class="stat-label">LVL</div>
                    <div class="stat-value" id="level">1</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Area ปุ่มกดสัมผัส -->
    <div class="controls-container">
        <!-- ฝั่งซ้าย: D-Pad -->
        <div class="dpad-group">
            <div class="dpad-row">
                <button class="control-btn" id="btn-left" tabindex="-1">←</button>
                <button class="control-btn" id="btn-right" tabindex="-1">→</button>
            </div>
            <button class="control-btn" id="btn-down" tabindex="-1">↓</button>
        </div>

        <!-- ฝั่งขวา: Pause (เว้นระยะห่างด้านบนมากขึ้น) และ Rotate (อยู่ด้านล่าง) -->
        <div class="action-group">
            <button class="control-btn" id="btn-pause" tabindex="-1" style="font-size: 24px;">❚❚</button>
            <button class="control-btn" id="btn-rotate" tabindex="-1">↻</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

const nextCanvas = document.getElementById('next');
const nextContext = nextCanvas.getContext('2d');
nextContext.scale(15, 15);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'move') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    } else if (type === 'softDrop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(70, now + 0.03);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.start(now);
        osc.stop(now + 0.03);
    } else if (type === 'land') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.setValueAtTime(180, now + 0.02);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
    } else if (type === 'clear') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.5);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    }
}

const arena = createMatrix(12, 20);
let isGameStarted = false;
let isPaused = false;
let isGameOver = false;
let isAnimatingClear = false;
let clearedRows = [];

let nextPieceMatrix = null;
let softDropIntervalTimer = null;

const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    score: 0,
    level: 1
};

function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

function createPiece(type) {
    if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
    if (type === 'L') return [[0,1,0],[0,1,0],[0,1,1]];
    if (type === 'J') return [[0,1,0],[0,1,0],[1,1,0]];
    if (type === 'O') return [[1,1],[1,1]];
    if (type === 'Z') return [[1,1,0],[0,1,1],[0,0,0]];
    if (type === 'S') return [[0,1,1],[1,1,0],[0,0,0]];
    if (type === 'T') return [[0,1,0],[1,1,1],[0,0,0]];
}

function getRandomPiece() {
    const pieces = 'ILJOTSZ';
    return createPiece(pieces[pieces.length * Math.random() | 0]);
}

function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

function addScore(points) {
    player.score += points;
    const newLevel = Math.floor(player.score / 100) + 1;
    if (newLevel !== player.level) {
        player.level = newLevel;
        dropInterval = Math.max(150, 850 - (player.level - 1) * 30);
    }
    updateScore();
}

function arenaSweep() {
    clearedRows = [];
    
    for (let y = arena.length - 1; y >= 0; --y) {
        let isFull = true;
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
                isFull = false;
                break;
            }
        }
        if (isFull) {
            clearedRows.push(y);
        }
    }

    if (clearedRows.length > 0) {
        isAnimatingClear = true;
        playSound('clear');

        setTimeout(() => {
            for (let y = arena.length - 1; y >= 0; --y) {
                let isFull = true;
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        isFull = false;
                        break;
                    }
                }
                if (isFull) {
                    const row = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(row);
                    y++;
                }
            }

            let pointsGain = 0;
            const count = clearedRows.length;
            if (count === 1) pointsGain = 1;
            else if (count === 2) pointsGain = 2;
            else if (count === 3) pointsGain = 3;
            else if (count >= 4) pointsGain = 5;
            
            addScore(pointsGain);

            clearedRows = [];
            isAnimatingClear = false;
            playerReset();
        }, 150);
    } else {
        playerReset();
    }
}

function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);

    context.strokeStyle = '#222';
    context.lineWidth = 0.03;
    for (let x = 0; x <= 12; x++) {
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, 20);
        context.stroke();
    }
    for (let y = 0; y <= 20; y++) {
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(12, y);
        context.stroke();
    }

    drawMatrix(arena, {x: 0, y: 0}, context);

    if (isAnimatingClear && clearedRows.length > 0) {
        context.fillStyle = '#FFF';
        clearedRows.forEach(y => {
            context.fillRect(0, y, 12, 1);
        });
    }

    if (player.matrix && !isAnimatingClear) {
        drawMatrix(player.matrix, player.pos, context);
    }

    drawNextPiece();
}

function drawNextPiece() {
    nextContext.fillStyle = '#000';
    nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

    if (nextPieceMatrix) {
        const xOffset = (4 - nextPieceMatrix[0].length) / 2;
        const yOffset = (4 - nextPieceMatrix.length) / 2;
        drawMatrix(nextPieceMatrix, {x: xOffset, y: yOffset}, nextContext);
    }
}

function drawMatrix(matrix, offset, ctx) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = '#FFF';
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 0.08;
                ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                
                ctx.fillStyle = '#DDD';
                ctx.fillRect(x + offset.x + 0.2, y + offset.y + 0.2, 0.6, 0.6);
            }
        });
    });
}

let dropCounter = 0;
let dropInterval = 850;
let lastTime = 0;

function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;

    if (isGameStarted && !isPaused && !isGameOver && !isAnimatingClear) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop(false);
        }
        draw();
    } else {
        draw();
    }

    requestAnimationFrame(update);
}

function playerDrop(isManual = false) {
    if (!isGameStarted || isPaused || isGameOver || isAnimatingClear) return;
    
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playSound('land');
        stopSoftDropLoop();
        arenaSweep();
    } else if (isManual) {
        playSound('softDrop');
    }
    dropCounter = 0;
}

function playerMove(dir) {
    if (!isGameStarted || isPaused || isGameOver || isAnimatingClear) return;
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    } else {
        playSound('move');
    }
}

function playerReset() {
    if (!nextPieceMatrix) {
        nextPieceMatrix = getRandomPiece();
    }
    
    player.matrix = nextPieceMatrix;
    nextPieceMatrix = getRandomPiece();

    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    dropCounter = 0;

    if (collide(arena, player)) {
        isGameOver = true;
        stopSoftDropLoop();
        playSound('gameover');
        document.getElementById('gameover-overlay').classList.remove('hidden');
    }
}

function playerRotate(dir) {
    if (!isGameStarted || isPaused || isGameOver || isAnimatingClear) return;
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
    playSound('move');
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
}

function togglePause() {
    if (!isGameStarted || isGameOver || isAnimatingClear) return;
    isPaused = !isPaused;
    if (isPaused) stopSoftDropLoop();
    const overlay = document.getElementById('pause-overlay');
    if (isPaused) {
        overlay.classList.remove('hidden');
    } else {
        overlay.classList.add('hidden');
    }
}

function startGame() {
    isGameStarted = true;
    document.getElementById('start-overlay').classList.add('hidden');
    playerReset();
    updateScore();
}

function restartGame() {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    player.level = 1;
    dropInterval = 850;
    isGameOver = false;
    isPaused = false;
    isAnimatingClear = false;
    clearedRows = [];
    stopSoftDropLoop();
    nextPieceMatrix = null;
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('pause-overlay').classList.add('hidden');
    updateScore();
    playerReset();
}

function updateScore() {
    document.getElementById('score').innerText = player.score;
    document.getElementById('level').innerText = player.level;
}

function startSoftDropLoop() {
    if (softDropIntervalTimer) return;
    playerDrop(true);
    softDropIntervalTimer = setInterval(() => {
        playerDrop(true);
    }, 45);
}

function stopSoftDropLoop() {
    if (softDropIntervalTimer) {
        clearInterval(softDropIntervalTimer);
        softDropIntervalTimer = null;
    }
}

/* Keyboard Events */
document.addEventListener('keydown', event => {
    if (event.keyCode === 32) {
        event.preventDefault();
    }

    if (event.keyCode === 32 || event.keyCode === 80) {
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
            document.activeElement.blur();
        }
        if (!isGameStarted) { startGame(); return; }
        if (isGameOver) { restartGame(); return; }
        togglePause();
        return;
    }

    if (!isGameStarted || isPaused || isGameOver || isAnimatingClear) return;

    if (event.keyCode === 37) playerMove(-1);
    else if (event.keyCode === 39) playerMove(1);
    else if (event.keyCode === 40) startSoftDropLoop();
    else if (event.keyCode === 38) playerRotate(1);
});

document.addEventListener('keyup', event => {
    if (event.keyCode === 40) {
        stopSoftDropLoop();
    }
});

function handleStartOrState() {
    if (!isGameStarted) { startGame(); return true; }
    if (isGameOver) { restartGame(); return true; }
    if (isPaused) { togglePause(); return true; }
    return false;
}

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnRotate = document.getElementById('btn-rotate');
const btnDown = document.getElementById('btn-down');
const btnPause = document.getElementById('btn-pause');

/* ปุ่ม Pause */
btnPause.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!isGameStarted) { startGame(); return; }
    if (isGameOver) { restartGame(); return; }
    togglePause();
});
btnPause.addEventListener('click', (e) => {
    e.target.blur();
    if (!isGameStarted) { startGame(); return; }
    if (isGameOver) { restartGame(); return; }
    togglePause();
});

/* ปุ่ม D-Pad และ Rotate */
btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); if (handleStartOrState()) return; playerMove(-1); });
btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); if (handleStartOrState()) return; playerMove(1); });
btnRotate.addEventListener('touchstart', (e) => { e.preventDefault(); if (handleStartOrState()) return; playerRotate(1); });

btnDown.addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    if (handleStartOrState()) return; 
    startSoftDropLoop(); 
});
btnDown.addEventListener('touchend', (e) => { 
    e.preventDefault(); 
    stopSoftDropLoop(); 
});

btnLeft.addEventListener('click', (e) => { e.target.blur(); if (handleStartOrState()) return; playerMove(-1); });
btnRight.addEventListener('click', (e) => { e.target.blur(); if (handleStartOrState()) return; playerMove(1); });
btnRotate.addEventListener('click', (e) => { e.target.blur(); if (handleStartOrState()) return; playerRotate(1); });

btnDown.addEventListener('mousedown', (e) => { e.target.blur(); if (handleStartOrState()) return; startSoftDropLoop(); });
btnDown.addEventListener('mouseup', () => { stopSoftDropLoop(); });
btnDown.addEventListener('mouseleave', () => { stopSoftDropLoop(); });

document.addEventListener('touchstart', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    if (!isGameStarted) { startGame(); return; }
    if (isPaused) { togglePause(); return; }
}, { passive: false });

update();
</script>

</body>
</html>
